name = "slrssbot-poller"
main = "cloudflare/worker.js"
compatibility_date = "2025-01-01"

# Run the poll trigger every 5 minutes on Cloudflare's edge
[triggers]
crons = ["*/5 * * * *"]

# Cloudflare Workers Observability (Logs & Tracing)
[observability]
enabled = true
head_sampling_rate = 1
redact_query_string = false

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = true
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false

# Secrets (set via CLI, never commit raw tokens):
#   npx wrangler secret put TGCLOUD_TOKEN
# Optional secret for manual HTTP POST /poll trigger:
#   npx wrangler secret put POLL_SECRET
