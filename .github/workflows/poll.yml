name: Manual Poll (Fallback)

# Automated scheduled polling is handled by Cloudflare Workers Cron Triggers
# (see wrangler.toml and cloudflare/worker.js).
# This workflow is kept as a manual workflow_dispatch fallback only.
on:
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Execute Telegram Serverless Poll
        env:
          TGCLOUD_TOKEN: ${{ secrets.TGCLOUD_TOKEN }}
        run: npx tgcloud run endpoints/poll '{}'

